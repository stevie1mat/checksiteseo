# Render Blueprint Configuration
# This file helps configure your Render service
# You can also configure via the Render dashboard

services:
  - type: web
    name: checksiteaeo-backend
    env: python
    region: oregon  # Change to your preferred region
    plan: free  # Change to 'starter' or 'standard' for paid plans
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      # These will be set in Render dashboard, but listed here for reference
      - key: ALLOWED_ORIGINS
        sync: false  # Set manually in dashboard
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EDEN_API_KEY
        sync: false
      - key: EDEN_API_BASE_URL
        value: "https://api.edenai.run"
      - key: EDEN_DEFAULT_MODEL
        value: "openai/gpt-4o-mini"
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_TOKENS_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_TOKENS_GROWTH
        sync: false
      - key: STRIPE_PRICE_ID_TOKENS_SCALE
        sync: false
      - key: DAILY_FREE_TOKENS
        value: "1000"
      - key: TOKENS_PER_SCAN
        value: "1000"
      - key: TOKENS_PER_CHAT
        value: "300"
      - key: MAX_SITES_PER_USER
        value: "25"
      - key: TOKEN_PACK_STARTER_TOKENS
        value: "100"
      - key: TOKEN_PACK_GROWTH_TOKENS
        value: "500"
      - key: TOKEN_PACK_SCALE_TOKENS
        value: "2000"
      - key: ENABLE_LEGACY_PLAN_GATES
        value: "false"
      - key: NEXT_PUBLIC_DAILY_FREE_TOKENS
        value: "1000"
      - key: NEXT_PUBLIC_TOKENS_PER_SCAN
        value: "1000"
      - key: NEXT_PUBLIC_TOKENS_PER_CHAT
        value: "300"
      - key: NEXT_PUBLIC_MAX_SITES_PER_USER
        value: "25"
      - key: ENABLE_RATE_LIMIT
        value: "true"
      - key: NODE_ENV
        value: "production"
