# Render Blueprint Configuration
# This file helps configure your Render service
# You can also configure via the Render dashboard

services:
  - type: web
    name: checksiteaeo-backend
    env: python
    region: oregon  # Change to your preferred region
    plan: free  # Change to 'starter' or 'standard' for paid plans
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      # These will be set in Render dashboard, but listed here for reference
      - key: ALLOWED_ORIGINS
        sync: false  # Set manually in dashboard
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PLUS
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: ENABLE_RATE_LIMIT
        value: "true"
      - key: NODE_ENV
        value: "production"
