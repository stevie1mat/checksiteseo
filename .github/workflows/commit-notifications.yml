name: Commit notifications
on:
  push:
    branches: ['**']
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMITTER: ${{ github.event.head_commit.author.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ github.event.head_commit.url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = {'text': f"New commit on {os.environ['BRANCH']} by {os.environ['COMMITTER']}: {os.environ['MESSAGE']}\n{os.environ['URL']}"}
          req = urllib.request.Request(os.environ['SLACK_WEBHOOK_URL'], json.dumps(payload).encode(), {'Content-Type': 'application/json'})
          urllib.request.urlopen(req).read()
          PY
